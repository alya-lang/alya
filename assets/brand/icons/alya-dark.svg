<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Chassis Surface Gradient -->
    <linearGradient id="chassis-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141928" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Chassis Outer Stroke Gradient -->
    <linearGradient id="chassis-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Header Surface Gradient -->
    <linearGradient id="header-surface" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.04)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>

    <!-- Alya Left Wing (Amethyst Purple) -->
    <linearGradient id="left-outer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8" />
      <stop offset="40%" stop-color="#9333ea" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>

    <linearGradient id="left-inner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Alya Right Wing (Electric Sky / Cyan) -->
    <linearGradient id="right-outer" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <linearGradient id="right-inner" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Neon Speed Chevron Beam -->
    <linearGradient id="neon-beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="25%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- CLI Chip Gradients -->
    <linearGradient id="cli-chip-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.18)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.18)" />
    </linearGradient>

    <linearGradient id="cli-chip-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.65" />
    </linearGradient>

    <!-- Filters -->
    <filter id="chassis-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.38" />
    </filter>

    <filter id="prism-ambient" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="beam-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path for Squircle Chassis -->
    <clipPath id="chassis-clip">
      <rect x="36" y="36" width="440" height="440" rx="92" />
    </clipPath>
  </defs>

  <!-- Squircle Chassis with Shadow -->
  <g filter="url(#chassis-shadow)">
    <rect x="36" y="36" width="440" height="440" rx="92"
          fill="url(#chassis-surface)"
          stroke="url(#chassis-stroke)"
          stroke-width="2.5" />
  </g>

  <!-- Clipped Terminal Interior -->
  <g clip-path="url(#chassis-clip)">
    <!-- Terminal Header Bar -->
    <rect x="36" y="36" width="440" height="60" fill="url(#header-surface)" />
    <line x1="36" y1="96" x2="476" y2="96" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

    <!-- Terminal Window Controls (Traffic Lights) -->
    <circle cx="76" cy="66" r="6" fill="#f43f5e" />
    <circle cx="98" cy="66" r="6" fill="#fbbf24" />
    <circle cx="120" cy="66" r="6" fill="#22c55e" />

    <!-- Header Center Tab: Terminal Shell Indicator -->
    <g transform="translate(256, 66)">
      <rect x="-48" y="-12" width="96" height="24" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <!-- Prompt > -->
      <path d="M -16 -4 L -11 0 L -16 4" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Cursor _ -->
      <rect x="-6" y="2" width="6" height="2" rx="0.5" fill="#c084fc" />
      <!-- Code Dots -->
      <circle cx="9" cy="0" r="1.5" fill="#94a3b8" opacity="0.6" />
      <circle cx="16" cy="0" r="1.5" fill="#94a3b8" opacity="0.6" />
      <circle cx="23" cy="0" r="1.5" fill="#94a3b8" opacity="0.6" />
    </g>

    <!-- Header Status Node (Compiler Active) -->
    <circle cx="436" cy="66" r="3.5" fill="#22c55e" />
    <circle cx="436" cy="66" r="7.5" fill="#22c55e" opacity="0.25" />

    <!-- High-Tech Compiler Matrix / Grid Lines -->
    <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
      <line x1="36" y1="150" x2="476" y2="150" />
      <line x1="36" y1="210" x2="476" y2="210" />
      <line x1="36" y1="270" x2="476" y2="270" />
      <line x1="36" y1="330" x2="476" y2="330" />
      <line x1="120" y1="96" x2="120" y2="476" />
      <line x1="200" y1="96" x2="200" y2="476" />
      <line x1="312" y1="96" x2="312" y2="476" />
      <line x1="392" y1="96" x2="392" y2="476" />
    </g>

    <!-- Ambient Corner Glows -->
    <circle cx="70" cy="130" r="140" fill="#a855f7" opacity="0.12" />
    <circle cx="440" cy="440" r="150" fill="#38bdf8" opacity="0.1" />

    <!-- Compiler Circuit Bus Traces -->
    <path d="M 36 295 H 85 L 115 325 H 135" stroke="#a855f7" stroke-width="1.4" opacity="0.25" fill="none" stroke-dasharray="4 3" />
    <circle cx="135" cy="325" r="2.5" fill="#a855f7" opacity="0.5" />
    <circle cx="135" cy="325" r="5" fill="#a855f7" opacity="0.2" />

    <path d="M 476 295 H 427 L 397 325 H 377" stroke="#38bdf8" stroke-width="1.4" opacity="0.25" fill="none" stroke-dasharray="4 3" />
    <circle cx="377" cy="325" r="2.5" fill="#38bdf8" opacity="0.5" />
    <circle cx="377" cy="325" r="5" fill="#38bdf8" opacity="0.2" />
  </g>

  <!-- ALYA PRISM EMBLEM -->
  <g transform="translate(0, 16)">
    <!-- Radial Aura Behind Emblem -->
    <ellipse cx="256" cy="226" rx="95" ry="90" fill="#a855f7" opacity="0.22" filter="url(#prism-ambient)" />
    <ellipse cx="256" cy="226" rx="65" ry="60" fill="#38bdf8" opacity="0.26" filter="url(#prism-ambient)" />

    <!-- The 'A' Structure -->
    <g id="alya-prism">
      <!-- 1. Left Outer Facet (Light Purple) -->
      <polygon points="256,106 142,342 173,342 256,172" fill="url(#left-outer)" />

      <!-- 2. Left Inner Facet (Shadow Violet) -->
      <polygon points="256,172 173,342 204,342 256,236" fill="url(#left-inner)" />

      <!-- 3. Right Outer Facet (Light Cyan) -->
      <polygon points="256,106 370,342 339,342 256,172" fill="url(#right-outer)" />

      <!-- 4. Right Inner Facet (Shadow Azure) -->
      <polygon points="256,172 339,342 308,342 256,236" fill="url(#right-inner)" />

      <!-- 5. Dynamic Forward-Angle Speed Chevron (Crossbeam) -->
      <g filter="url(#beam-glow)">
        <polygon points="160,256 256,234 352,256 335,278 256,258 177,278" fill="url(#neon-beam)" />
        <!-- Glowing Center Energy Spark -->
        <polygon points="256,239 264,247 256,254 248,247" fill="#ffffff" />
      </g>

      <!-- 6. Apex Diamond Shard (Light Crown) -->
      <polygon points="256,101 269,130 256,144 243,130" fill="#ffffff" opacity="0.98" />
      <polygon points="256,101 269,130 256,134" fill="#bae6fd" opacity="0.85" />
    </g>
  </g>

  <!-- CLI COMMAND PILL (>_ alya) -->
  <g transform="translate(256, 412)">
    <!-- Pill Container -->
    <rect x="-100" y="-19" width="200" height="38" rx="19"
          fill="url(#cli-chip-bg)"
          stroke="url(#cli-chip-border)"
          stroke-width="1.5" />

    <!-- Terminal Prompt Chevron '>' -->
    <path d="M -68 -6 L -61 0 L -68 6" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Terminal Underscore Cursor '_' -->
    <rect x="-56" y="5.5" width="8" height="2.8" rx="0.8" fill="#c084fc" />

    <!-- Pure Vector Letterforms for alya (No Font Dependencies) -->
    <g fill="#f8fafc">
      <!-- A -->
      <path d="M -36 9 L -27.5 -9 L -19 9 L -23.5 9 L -25 5.2 L -30 5.2 L -31.5 9 Z M -27.5 -4.5 L -29 2 L -26 2 Z" />
      <!-- L -->
      <path d="M -12 -9 L -7.5 -9 L -7.5 5 L 1 5 L 1 9 L -12 9 Z" />
      <!-- Y -->
      <path d="M 7 -9 L 11.5 -9 L 14.5 -2.5 L 17.5 -9 L 22 -9 L 17 0.5 L 17 9 L 12.5 9 L 12.5 0.5 Z" />
      <!-- A -->
      <path d="M 28 9 L 36.5 -9 L 45 9 L 40.5 9 L 39 5.2 L 34 5.2 L 32.5 9 Z M 36.5 -4.5 L 35 2 L 38 2 Z" />
      <!-- C -->
      <path d="M 67 -4.5 C 65 -7.5 62 -9 59.5 -9 C 54.5 -9 52 -4.5 52 0 C 52 4.5 54.5 9 59.5 9 C 62 9 65 7.5 67 4.5 L 63.5 2 C 62.5 3.6 61.2 4.8 59.5 4.8 C 56.5 4.8 56.2 2.5 56.2 0 C 56.2 -2.5 56.5 -4.8 59.5 -4.8 C 61.2 -4.8 62.5 -3.6 63.5 -2 Z" />
    </g>
  </g>
</svg>
