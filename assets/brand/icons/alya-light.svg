<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Chassis Surface Gradient (Light Theme) -->
    <linearGradient id="chassis-surface-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Chassis Outer Stroke Gradient -->
    <linearGradient id="chassis-stroke-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Left Wing (Deep Rich Amethyst) -->
    <linearGradient id="left-outer-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="40%" stop-color="#7e22ce" />
      <stop offset="80%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="left-inner-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Right Wing (Deep Rich Sky/Azure) -->
    <linearGradient id="right-outer-light" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="right-inner-light" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Neon Speed Chevron Beam (Light Theme) -->
    <linearGradient id="neon-beam-light" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="25%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filters -->
    <filter id="chassis-shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <filter id="prism-ambient-light" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="beam-glow-light" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path for Squircle Chassis -->
    <clipPath id="chassis-clip-light">
      <rect x="36" y="36" width="440" height="440" rx="92" />
    </clipPath>
  </defs>

  <!-- Squircle Chassis with Shadow -->
  <g filter="url(#chassis-shadow-light)">
    <rect x="36" y="36" width="440" height="440" rx="92"
          fill="url(#chassis-surface-light)"
          stroke="url(#chassis-stroke-light)"
          stroke-width="2" />
  </g>

  <!-- Clipped Interior -->
  <g clip-path="url(#chassis-clip-light)">
    <!-- High-Tech Compiler Matrix / Grid Lines -->
    <g opacity="0.035" stroke="#475569" stroke-width="1">
      <line x1="36" y1="150" x2="476" y2="150" />
      <line x1="36" y1="210" x2="476" y2="210" />
      <line x1="36" y1="270" x2="476" y2="270" />
      <line x1="36" y1="330" x2="476" y2="330" />
      <line x1="120" y1="96" x2="120" y2="476" />
      <line x1="200" y1="96" x2="200" y2="476" />
      <line x1="312" y1="96" x2="312" y2="476" />
      <line x1="392" y1="96" x2="392" y2="476" />
    </g>

    <!-- Ambient Corner Glows -->
    <circle cx="70" cy="130" r="140" fill="#a855f7" opacity="0.06" />
    <circle cx="440" cy="440" r="150" fill="#38bdf8" opacity="0.05" />

    <!-- Compiler Circuit Bus Traces -->
    <path d="M 36 295 H 85 L 115 325 H 135" stroke="#9333ea" stroke-width="1.4" opacity="0.22" fill="none" stroke-dasharray="4 3" />
    <circle cx="135" cy="325" r="2.5" fill="#9333ea" opacity="0.4" />

    <path d="M 476 295 H 427 L 397 325 H 377" stroke="#0284c7" stroke-width="1.4" opacity="0.22" fill="none" stroke-dasharray="4 3" />
    <circle cx="377" cy="325" r="2.5" fill="#0284c7" opacity="0.4" />
  </g>

  <!-- ALYA PRISM EMBLEM (Light Theme - Rich High-Contrast Facets) -->
  <g transform="translate(0, 40)">
    <!-- Radial Aura Behind Emblem -->
    <ellipse cx="256" cy="226" rx="95" ry="90" fill="#a855f7" opacity="0.12" filter="url(#prism-ambient-light)" />
    <ellipse cx="256" cy="226" rx="65" ry="60" fill="#38bdf8" opacity="0.14" filter="url(#prism-ambient-light)" />

    <!-- The 'A' Structure -->
    <g id="alya-prism">
      <!-- 1. Left Outer Facet -->
      <polygon points="256,106 142,342 173,342 256,172" fill="url(#left-outer-light)" />

      <!-- 2. Left Inner Facet -->
      <polygon points="256,172 173,342 204,342 256,236" fill="url(#left-inner-light)" />

      <!-- 3. Right Outer Facet -->
      <polygon points="256,106 370,342 339,342 256,172" fill="url(#right-outer-light)" />

      <!-- 4. Right Inner Facet -->
      <polygon points="256,172 339,342 308,342 256,236" fill="url(#right-inner-light)" />

      <!-- 5. Dynamic Forward-Angle Speed Chevron (Crossbeam) -->
      <g filter="url(#beam-glow-light)">
        <polygon points="160,256 256,234 352,256 335,278 256,258 177,278" fill="url(#neon-beam-light)" />
        <!-- Glowing Center Energy Spark -->
        <polygon points="256,239 264,247 256,254 248,247" fill="#ffffff" />
      </g>

      <!-- 6. Apex Diamond Shard -->
      <polygon points="256,101 269,130 256,144 243,130" fill="#ffffff" opacity="0.98" />
      <polygon points="256,101 269,130 256,134" fill="#93c5fd" opacity="0.85" />
    </g>
  </g>

</svg>
