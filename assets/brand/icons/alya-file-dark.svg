<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 34 384 464" width="512" height="512">
  <defs>
    <!-- Document Card Surface Gradient -->
    <linearGradient id="doc-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141928" />
      <stop offset="45%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Document Card Outer Border -->
    <linearGradient id="doc-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25" />
    </linearGradient>

    <!-- Flap Gradients -->
    <linearGradient id="flap-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242c44" />
      <stop offset="55%" stop-color="#182035" />
      <stop offset="100%" stop-color="#0e1424" />
    </linearGradient>

    <linearGradient id="flap-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Alya Left Wing (Amethyst Purple) -->
    <linearGradient id="left-outer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8" />
      <stop offset="40%" stop-color="#9333ea" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>

    <linearGradient id="left-inner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Alya Right Wing (Electric Sky / Cyan) -->
    <linearGradient id="right-outer" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <linearGradient id="right-inner" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Neon Speed Chevron Beam -->
    <linearGradient id="neon-beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="25%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.38" />
    </filter>

    <filter id="flap-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-4" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="emblem-ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="beam-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path for Document Body -->
    <clipPath id="doc-clip">
      <path d="M 116 42 
               L 332 42 
               L 424 134 
               L 424 442 
               A 26 26 0 0 1 398 468 
               L 114 468 
               A 26 26 0 0 1 88 442 
               L 88 70 
               A 26 26 0 0 1 116 42 Z" />
    </clipPath>
  </defs>

  <!-- Document Card Shadow & Base -->
  <g filter="url(#card-shadow)">
    <path d="M 116 42 
             L 332 42 
             L 424 134 
             L 424 442 
             A 26 26 0 0 1 398 468 
             L 114 468 
             A 26 26 0 0 1 88 442 
             L 88 70 
             A 26 26 0 0 1 116 42 Z" 
          fill="url(#doc-surface)" 
          stroke="url(#doc-stroke)" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
  </g>

  <!-- Clipped Inner Highlights & Code Watermarks -->
  <g clip-path="url(#doc-clip)">
    <!-- Ambient Radial Corner Glows -->
    <circle cx="110" cy="70" r="140" fill="#a855f7" opacity="0.13" />
    <circle cx="410" cy="430" r="150" fill="#38bdf8" opacity="0.09" />

    <!-- Subtle Code Watermark Lines -->
    <g opacity="0.065" fill="#cbd5e1">
      <rect x="124" y="94" width="60" height="6" rx="3" fill="#c084fc" />
      <rect x="190" y="94" width="48" height="6" rx="3" fill="#38bdf8" />
      <rect x="144" y="114" width="96" height="5" rx="2.5" />
      <rect x="144" y="129" width="128" height="5" rx="2.5" />
      <rect x="144" y="144" width="76" height="5" rx="2.5" />
      <rect x="124" y="162" width="32" height="5" rx="2.5" fill="#c084fc" />

      <!-- Bottom Lines -->
      <rect x="124" y="375" width="44" height="5" rx="2.5" />
      <rect x="174" y="375" width="76" height="5" rx="2.5" fill="#34d399" />
    </g>

    <!-- High-Tech Hardware Bus Traces -->
    <path d="M 88 325 H 132 L 152 345 H 164" stroke="#a855f7" stroke-width="1.2" opacity="0.22" fill="none" stroke-dasharray="3 3" />
    <circle cx="164" cy="345" r="2" fill="#a855f7" opacity="0.4" />
    <path d="M 424 295 H 380 L 360 275 H 348" stroke="#38bdf8" stroke-width="1.2" opacity="0.22" fill="none" stroke-dasharray="3 3" />
    <circle cx="348" cy="275" r="2" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- Folded Corner Flap -->
  <g filter="url(#flap-shadow)">
    <path d="M 332 42 
             L 332 122 
             A 12 12 0 0 0 344 134 
             L 424 134 Z" 
          fill="url(#flap-surface)" 
          stroke="url(#flap-stroke)" 
          stroke-width="2" 
          stroke-linejoin="round" />
    <line x1="332" y1="42" x2="424" y2="134" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1.5" />
  </g>

  <!-- ALYA EMBLEM: PRECISION 3D FACETED DELTA -->
  <g transform="translate(0, 54)">
    <!-- Radial Aura Behind Emblem -->
    <circle cx="256" cy="226" r="95" fill="#a855f7" opacity="0.22" filter="url(#emblem-ambient)" />
    <circle cx="256" cy="226" r="60" fill="#38bdf8" opacity="0.26" filter="url(#emblem-ambient)" />

    <!-- The "A" Structure -->
    <g id="alya-prism">
      <!-- 1. Left Outer Facet (Light Purple) -->
      <polygon points="256,126 160,324 186,324 256,182" fill="url(#left-outer)" />

      <!-- 2. Left Inner Facet (Shadow Violet) -->
      <polygon points="256,182 186,324 212,324 256,236" fill="url(#left-inner)" />

      <!-- 3. Right Outer Facet (Light Cyan) -->
      <polygon points="256,126 352,324 326,324 256,182" fill="url(#right-outer)" />

      <!-- 4. Right Inner Facet (Shadow Azure) -->
      <polygon points="256,182 326,324 300,324 256,236" fill="url(#right-inner)" />

      <!-- 5. Dynamic Forward-Angle Speed Chevron (Crossbeam) -->
      <g filter="url(#beam-glow)">
        <polygon points="176,252 256,234 336,252 322,270 256,254 190,270" 
                 fill="url(#neon-beam)" />
        <!-- Glowing Center Energy Spark -->
        <polygon points="256,238 263,245 256,251 249,245" fill="#ffffff" />
      </g>

      <!-- 6. Apex Diamond Shard (Light Crown) -->
      <polygon points="256,122 267,146 256,158 245,146" fill="#ffffff" opacity="0.98" />
      <polygon points="256,122 267,146 256,149" fill="#bae6fd" opacity="0.8" />
    </g>
  </g>

</svg>