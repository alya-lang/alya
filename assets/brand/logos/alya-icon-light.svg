<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 97 236 249" width="512" height="512">
  <defs>
    <!-- Left Wing (Deep Rich Amethyst) -->
    <linearGradient id="logo-left-outer-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="40%" stop-color="#7e22ce" />
      <stop offset="80%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="logo-left-inner-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Right Wing (Deep Rich Sky/Azure) -->
    <linearGradient id="logo-right-outer-light" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="logo-right-inner-light" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Neon Speed Chevron Beam -->
    <linearGradient id="logo-neon-beam-light" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="25%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filters -->
    <filter id="logo-ambient-light" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="logo-beam-glow-light" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon (Gentle Lavender-Cyan Halo for Light Backgrounds) -->
  <ellipse cx="256" cy="226" rx="95" ry="90" fill="#a855f7" opacity="0.14" filter="url(#logo-ambient-light)" />
  <ellipse cx="256" cy="226" rx="65" ry="60" fill="#0ea5e9" opacity="0.16" filter="url(#logo-ambient-light)" />

  <!-- The "A" Structure -->
  <g id="alya-prism-light">
    <!-- 1. Left Outer Facet -->
    <polygon points="256,106 142,342 173,342 256,172" fill="url(#logo-left-outer-light)" />

    <!-- 2. Left Inner Facet -->
    <polygon points="256,172 173,342 204,342 256,236" fill="url(#logo-left-inner-light)" />

    <!-- 3. Right Outer Facet -->
    <polygon points="256,106 370,342 339,342 256,172" fill="url(#logo-right-outer-light)" />

    <!-- 4. Right Inner Facet -->
    <polygon points="256,172 339,342 308,342 256,236" fill="url(#logo-right-inner-light)" />

    <!-- 5. Dynamic Forward-Angle Speed Chevron -->
    <g filter="url(#logo-beam-glow-light)">
      <polygon points="160,256 256,234 352,256 335,278 256,258 177,278" 
               fill="url(#logo-neon-beam-light)" 
                />
      <!-- Glowing Center Energy Spark -->
      <polygon points="256,239 264,247 256,254 248,247" fill="#ffffff" />
    </g>

    <!-- 6. Apex Diamond Shard -->
    <polygon points="256,101 269,130 256,144 243,130" fill="#ffffff"  />
    <polygon points="256,101 269,130 256,134" fill="#bae6fd" />
  </g>
</svg>