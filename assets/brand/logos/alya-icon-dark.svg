<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 97 236 249" width="512" height="512">
  <defs>
    <!-- Alya Left Wing (Amethyst Purple) -->
    <linearGradient id="logo-left-outer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8" />
      <stop offset="40%" stop-color="#9333ea" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>

    <linearGradient id="logo-left-inner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Alya Right Wing (Electric Sky / Cyan) -->
    <linearGradient id="logo-right-outer" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <linearGradient id="logo-right-inner" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Neon Speed Chevron Beam -->
    <linearGradient id="logo-neon-beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="25%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="logo-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="logo-beam-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <ellipse cx="256" cy="226" rx="95" ry="90" fill="#a855f7" opacity="0.25" filter="url(#logo-ambient)" />
  <ellipse cx="256" cy="226" rx="65" ry="60" fill="#38bdf8" opacity="0.3" filter="url(#logo-ambient)" />

  <!-- The "A" Structure -->
  <g id="alya-prism">
    <!-- 1. Left Outer Facet (Light Purple) -->
    <polygon points="256,106 142,342 173,342 256,172" fill="url(#logo-left-outer)" />

    <!-- 2. Left Inner Facet (Shadow Violet) -->
    <polygon points="256,172 173,342 204,342 256,236" fill="url(#logo-left-inner)" />

    <!-- 3. Right Outer Facet (Light Cyan) -->
    <polygon points="256,106 370,342 339,342 256,172" fill="url(#logo-right-outer)" />

    <!-- 4. Right Inner Facet (Shadow Azure) -->
    <polygon points="256,172 339,342 308,342 256,236" fill="url(#logo-right-inner)" />

    <!-- 5. Dynamic Forward-Angle Speed Chevron (Crossbeam) -->
    <g filter="url(#logo-beam-glow)">
      <polygon points="160,256 256,234 352,256 335,278 256,258 177,278" 
               fill="url(#logo-neon-beam)" />
      <!-- Glowing Center Energy Spark -->
      <polygon points="256,239 264,247 256,254 248,247" fill="#ffffff" />
    </g>

    <!-- 6. Apex Diamond Shard (Light Crown) -->
    <polygon points="256,101 269,130 256,144 243,130" fill="#ffffff" opacity="0.98" />
    <polygon points="256,101 269,130 256,134" fill="#bae6fd" opacity="0.85" />
  </g>
</svg>