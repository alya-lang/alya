name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.2)'
        required: true
        default: 'v0.0.2'
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: x86_64-linux
            bin: alyac
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: x86_64-macos
            bin: alyac
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: arm64-macos
            bin: alyac
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: x86_64-windows
            bin: alyac.exe
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          PACKAGE_NAME="alyac-${VERSION}-${{ matrix.platform }}"
          mkdir "${PACKAGE_NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${PACKAGE_NAME}/"
          cp README.md LICENSE "${PACKAGE_NAME}/"
          tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          shasum -a 256 "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"

      - name: Package artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          
          # 1. Standard lightweight package
          $PackageName = "alyac-$Version-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $PackageName | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" -Destination $PackageName
          Copy-Item README.md, LICENSE -Destination $PackageName
          Compress-Archive -Path $PackageName -DestinationPath "$PackageName.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$PackageName.zip").Hash.ToLower()
          "$hash  $PackageName.zip" | Out-File -FilePath "$PackageName.zip.sha256" -Encoding ascii

          # 2. Standalone offline package (with pre-bundled toolchain)
          $StandaloneName = "alyac-$Version-${{ matrix.platform }}-standalone"
          New-Item -ItemType Directory -Force -Path $StandaloneName | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" -Destination $StandaloneName
          Copy-Item README.md, LICENSE -Destination $StandaloneName
          
          # Download and bundle minimal toolchain (tracking latest release, with fallback)
          $tcUrl = "https://github.com/alya-lang/toolchain/releases/latest/download/alya-toolchain-windows-x64.zip"
          $tcZip = Join-Path $StandaloneName "toolchain.zip"
          $tcDir = Join-Path $StandaloneName "toolchain"
          try {
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              try {
                  Invoke-WebRequest -Uri $tcUrl -OutFile $tcZip -UseBasicParsing
              } catch {
                  Write-Host "Latest toolchain download failed, falling back to v1.0.0: $_"
                  Invoke-WebRequest -Uri "https://github.com/alya-lang/toolchain/releases/download/v1.0.0/alya-toolchain-windows-x64.zip" -OutFile $tcZip -UseBasicParsing
              }
              Expand-Archive -Path $tcZip -DestinationPath $tcDir -Force
              Remove-Item -Force $tcZip
          } catch {
              Write-Host "Warning: Could not fetch pre-bundled toolchain for standalone package: $_"
          }

          Compress-Archive -Path $StandaloneName -DestinationPath "$StandaloneName.zip"
          $hashStandalone = (Get-FileHash -Algorithm SHA256 "$StandaloneName.zip").Hash.ToLower()
          "$hashStandalone  $StandaloneName.zip" | Out-File -FilePath "$StandaloneName.zip.sha256" -Encoding ascii

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            alyac-*-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          python3 .github/scripts/generate_release_notes.py "$TAG"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          tag_name: ${{ steps.notes.outputs.tag }}
          prerelease: ${{ inputs.prerelease == true || (inputs.prerelease != false && contains(steps.notes.outputs.tag, '-')) }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: dist/*
