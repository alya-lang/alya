name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.20)'
        required: true
        default: 'v0.0.20'
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux legs pin ubuntu-22.04 (glibc 2.35): binaries stay
          # runnable on bookworm (2.36)+. Building on ubuntu-latest
          # (noble, 2.39) locks a GLIBC_2.39 floor that bookworm rejects
          # (alya-lang/alya#64). ARM64 stays on 24.04-arm: no 22.04 ARM
          # runner label exists.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: x86_64-linux
            label: Linux x64
            bin: alya
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: arm64-linux
            label: Linux ARM64
            bin: alya
            archive: tar.gz
          - os: ubuntu-22.04
            target: i686-unknown-linux-gnu
            platform: x86-linux
            label: Linux x86
            bin: alya
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: x86_64-macos
            label: macOS Intel
            bin: alya
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: arm64-macos
            label: macOS ARM64
            bin: alya
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: x86_64-windows
            label: Windows x64
            bin: alya.exe
            archive: zip
            tc: alya-toolchain-windows-x64.zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: arm64-windows
            label: Windows ARM64
            bin: alya.exe
            archive: zip
            tc: alya-toolchain-windows-arm64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install 32-bit C toolchain (Linux x86 leg)
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-i386

      - name: Rust cache
        # Key must include the OS image: build-script binaries cached on
        # one glibc floor (e.g. noble/2.39) do not execute on an older one
        # (jammy/2.35), which fails the build itself (alya-lang/alya#64).
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}-${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          bash .github/scripts/package-unix-release.sh "$VERSION" "${{ matrix.platform }}" "${{ matrix.target }}" "${{ matrix.bin }}"

      - name: Package artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          .github/scripts/package-windows-release.ps1 -Version $Version -Platform "${{ matrix.platform }}" -Target "${{ matrix.target }}" -Bin "${{ matrix.bin }}" -Tc "${{ matrix.tc }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            alya-*-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          python3 .github/scripts/generate_release_notes.py "$TAG"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          tag_name: ${{ steps.notes.outputs.tag }}
          prerelease: ${{ inputs.prerelease == true || (inputs.prerelease != false && contains(steps.notes.outputs.tag, '-')) }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: dist/*

      - name: Update Distribution Manifests and Push Checksums
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          WIN_SHA=$(cut -d' ' -f1 < dist/alya-${TAG}-x86_64-windows.zip.sha256)
          ARM_SHA=$(cut -d' ' -f1 < dist/alya-${TAG}-arm64-windows.zip.sha256)
          echo "Updating distribution manifests for $TAG"
          echo "  x64:   $WIN_SHA"
          echo "  ARM64: $ARM_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main
          git pull origin main --rebase

          python3 .github/scripts/update_distribution_checksums.py "$TAG" "$WIN_SHA" "$ARM_SHA"

          if [ -n "$(git status --porcelain packages/distribution)" ]; then
            git add packages/distribution
            git commit -m "chore(distribution): record $TAG release checksums for winget, choco, and scoop [skip ci]"
            git push origin main

            git fetch origin develop
            git checkout develop
            git pull origin develop --rebase
            git merge main -m "chore: sync $TAG distribution checksums to develop [skip ci]"
            git push origin develop
          else
            echo "Distribution manifests are already up-to-date."
          fi
