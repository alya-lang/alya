name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.label }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
          - os: ubuntu-24.04-arm
            label: Linux ARM64
          - os: windows-latest
            label: Windows x64
          - os: windows-11-arm
            label: Windows ARM64
          - os: macos-latest
            label: macOS ARM64
          - os: macos-15-intel
            label: macOS Intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Provision Windows ARM64 C toolchain
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: .github/scripts/provision-windows-arm64-toolchain.ps1

      - name: Run test suite
        run: cargo test --verbose ${{ matrix.cargo_args }}

      - name: Run Alya test suites (alya test)
        run: cargo run ${{ matrix.cargo_args }} -- test

      - name: Verify Toolchain Commands
        run: |
          cargo run -- toolchain status
          cargo run -- toolchain help

  spike-lex-parse:
    name: Spike differential (lexer + parser)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Runner images ship Python 3 (stdlib-only harnesses); no setup needed.
      - name: Build debug compiler
        run: cargo build --verbose

      - name: Differential lexer (Rust vs Alya frontend)
        run: python3 spike/selfhost/diff_lex.py --alya ./target/debug/alya

      - name: Differential parser (Rust vs Alya frontend)
        run: python3 spike/selfhost/diff_parse.py --alya ./target/debug/alya

  spike-emit:
    name: Spike differential (Alya emitter)
    needs: [lint]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build debug compiler
        run: cargo build --verbose

      # The Alya-written x64 emitter targets Windows; the driver exits
      # nonzero unless all 19 programs match `alya run` byte-exactly.
      - name: Differential emitter (Alya backend vs Rust backend)
        shell: pwsh
        run: ./target/debug/alya.exe run spike/selfhost/diff_emit.alya -- target/debug/alya.exe

  release-check:
    name: Release build (${{ matrix.label }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
          - os: ubuntu-24.04-arm
            label: Linux ARM64
          - os: windows-latest
            label: Windows x64
          - os: windows-11-arm
            label: Windows ARM64
          - os: macos-latest
            label: macOS ARM64
          - os: macos-15-intel
            label: macOS Intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose
