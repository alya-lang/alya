name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Code Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Linting (clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.label }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
          - os: ubuntu-24.04-arm
            label: Linux ARM64
          - os: ubuntu-latest
            label: Linux x86
            target: i686-unknown-linux-gnu
          - os: windows-latest
            label: Windows x64
          - os: windows-11-arm
            label: Windows ARM64
          - os: macos-latest
            label: macOS ARM64
          - os: macos-15-intel
            label: macOS Intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install 32-bit C toolchain (Linux x86 leg)
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-i386

      - name: Provision Windows ARM64 C toolchain
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $tcDir = "$env:USERPROFILE/.alya/toolchain"
          New-Item -ItemType Directory -Force -Path $tcDir | Out-Null
          $zip = "$env:RUNNER_TEMP/toolchain-arm64.zip"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest -Uri "https://github.com/alya-lang/toolchain/releases/latest/download/alya-toolchain-windows-arm64.zip" -OutFile $zip -UseBasicParsing
          } catch {
            Write-Host "Latest toolchain download failed, falling back to v1.0.0"
            Invoke-WebRequest -Uri "https://github.com/alya-lang/toolchain/releases/download/v1.0.0/alya-toolchain-windows-arm64.zip" -OutFile $zip -UseBasicParsing
          }
          Expand-Archive -Path $zip -DestinationPath $tcDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$tcDir/bin"

      - name: Run test suite
        if: matrix.target == ''
        run: cargo test --verbose

      - name: Run test suite (32-bit)
        if: matrix.target != ''
        run: cargo test --verbose --target ${{ matrix.target }}

      - name: Build release binary
        if: matrix.target == ''
        run: cargo build --release --verbose

      - name: Build release binary (32-bit)
        if: matrix.target != ''
        run: cargo build --release --verbose --target ${{ matrix.target }}

      - name: Run self-hosted test suites
        if: matrix.target == ''
        run: cargo run -- test tests/

      - name: Run self-hosted test suites (32-bit)
        if: matrix.target != ''
        run: cargo run --target ${{ matrix.target }} -- test tests/

      - name: Verify Toolchain Commands
        run: |
          cargo run -- toolchain status
          cargo run -- toolchain help
