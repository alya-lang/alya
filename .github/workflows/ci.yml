name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Code Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Linting (clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.label }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
          - os: ubuntu-24.04-arm
            label: Linux ARM64
          - os: windows-latest
            label: Windows x64
          - os: windows-11-arm
            label: Windows ARM64
          - os: macos-latest
            label: macOS ARM64
          - os: macos-15-intel
            label: macOS Intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Provision Windows ARM64 C toolchain
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $tcDir = "$env:USERPROFILE/.alya/toolchain"
          New-Item -ItemType Directory -Force -Path $tcDir | Out-Null
          $zip = "$env:RUNNER_TEMP/toolchain-arm64.zip"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest -Uri "https://github.com/alya-lang/toolchain/releases/latest/download/alya-toolchain-windows-arm64.zip" -OutFile $zip -UseBasicParsing
          } catch {
            Write-Host "Latest toolchain download failed, falling back to v1.0.0"
            Invoke-WebRequest -Uri "https://github.com/alya-lang/toolchain/releases/download/v1.0.0/alya-toolchain-windows-arm64.zip" -OutFile $zip -UseBasicParsing
          }
          Expand-Archive -Path $zip -DestinationPath $tcDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$tcDir/bin"

      - name: Run test suite
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Verify Toolchain Commands
        run: |
          cargo run -- toolchain status
          cargo run -- toolchain help

  test-x86:
    name: Test (Windows x86 codegen)
    needs: [fmt, clippy]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build and run x86 program (WOW64)
        shell: pwsh
        env:
          ALYA_TOOLCHAIN_AUTO_INSTALL: "1"
        run: |
          Set-Content -Path hello32.alya -Value 'say "Hello from x86!"'
          cargo run -- build hello32.alya --arch x86 -b -o hello32.exe
          ./hello32.exe

